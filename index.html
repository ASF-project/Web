<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AppName — Activation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #102A43;
    --teal: #0E7C7B;
    --teal-soft: #E6F3F2;
    --amber: #D98E04;
    --canvas: #F7F8FA;
    --text: #1F2933;
    --muted: #616E7C;
    --border: #E3E7ED;
    --red: #C53030;
    --green: #2F855A;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Inter", system-ui, sans-serif; background: var(--canvas); color: var(--text); line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; }

  nav { background: var(--navy); color: #fff; }
  nav .wrap { max-width: 560px; margin: 0 auto; padding: 0 24px; height: 64px; display: flex; align-items: center; }
  .logo { font-weight: 700; font-size: 22px; }

  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 48px 24px; }
  .card { width: 100%; max-width: 560px; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 32px; }
  h1 { font-size: 26px; color: var(--navy); margin-bottom: 4px; }
  .sub { color: var(--muted); margin-bottom: 24px; }

  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; color: var(--navy); }
  .field { margin-bottom: 16px; }
  input { width: 100%; padding: 12px 14px; font-size: 15px; font-family: "Consolas", monospace; border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--text); }
  input:focus { outline: 2px solid var(--teal-soft); border-color: var(--teal); }
  input[readonly] { background: var(--canvas); }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }

  .btn { background: var(--teal); color: #fff; font-weight: 600; border: none; border-radius: 8px; padding: 12px 20px; font-size: 15px; cursor: pointer; font-family: inherit; }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .btn-full { width: 100%; }
  .btn-outline { background: #fff; color: var(--navy); border: 1px solid var(--border); }

  .msg { font-size: 14px; margin-top: 8px; min-height: 20px; }
  .msg.err { color: var(--red); }
  .msg.ok { color: var(--green); }
  hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }

  footer { text-align: center; color: var(--muted); font-size: 14px; padding: 24px 0; }
</style>
</head>
<body>

<nav><div class="wrap"><span class="logo">AppName</span></div></nav>

<main>
  <div class="card">
    <h1>Activate</h1>
    <p class="sub">Generate an activation key for your device.</p>

    <div class="field">
      <label for="userKey">User key</label>
      <input id="userKey" maxlength="32" placeholder="Paste the 32-character key shown in the app">
    </div>
    <button class="btn btn-full" id="generate">Generate</button>
    <div class="msg" id="msg"></div>

    <hr>

    <div class="field">
      <label for="actKey">Activation key</label>
      <div class="row">
        <input id="actKey" readonly placeholder="Your activation key will appear here">
        <button class="btn btn-outline" id="copy">Copy</button>
      </div>
    </div>
  </div>
</main>

<footer>© 2026 AppName</footer>

<script>
  // API URL is loaded from config.json (updated automatically by the server)
  let API = null;
  fetch(`config.json?t=${Date.now()}`, { cache: "no-store" })
    .then(r => r.json()).then(d => { API = d.api || null; })
    .catch(() => {});

  const $ = id => document.getElementById(id);

  $("generate").onclick = async () => {
    const userKey = $("userKey").value.trim();
    const msg = $("msg");
    msg.className = "msg"; msg.textContent = "";
    $("actKey").value = "";

    if (!userKey) { msg.className = "msg err"; msg.textContent = "Enter the user key."; return; }
    if (!API) { msg.className = "msg err"; msg.textContent = "Server is offline. Try again later."; return; }
    if (!/^[A-Fa-f0-9]{32}$/.test(userKey)) { msg.className = "msg err"; msg.textContent = "User key must be 32 characters (0-9, A-F)."; return; }

    $("generate").disabled = true; $("generate").textContent = "Generating…";
    try {
      const r = await fetch(`${API}/api/activate`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ requestKey: userKey })
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || "Request failed");
      $("actKey").value = d.activationKey;
      msg.className = "msg ok"; msg.textContent = "Activation key generated.";
    } catch (e) {
      msg.className = "msg err";
      msg.textContent = e.message === "Failed to fetch" ? "Can't reach the server." : e.message;
    } finally {
      $("generate").disabled = false; $("generate").textContent = "Generate";
    }
  };

  $("copy").onclick = async () => {
    if (!$("actKey").value) return;
    await navigator.clipboard.writeText($("actKey").value);
    $("copy").textContent = "Copied!";
    setTimeout(() => $("copy").textContent = "Copy", 1500);
  };
</script>
</body>
</html>
